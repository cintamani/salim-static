# Article: 25-gennaio-2025
art_25_gennaio_2025:
  meta:
    title: "Association Salim ODV - Blog - Salim Odv participe à \"Conversescion\""
    description: "Interview avec Salim Odv"
  header:
    title: "Salim Odv participe à \"Conversescion\""
    date: "25 janvier 2025"
  content:
    intro_p1: "Sara (la présidente) et Carlo (le trésorier) ont eu l'opportunité de participer à l'émission de radio \"Conversescion\" de Ciao Como Radio et de présenter le travail de l'association."
    intro_p2: "Ce fut une merveilleuse expérience, et nous sommes prêts et impatients de la renouveler sur d'autres stations… restez à l'écoute !"
    intro_p3: "Voici l'interview complète"

# Article: 14-febbraio-2025
art_14_febbraio_2025:
  meta:
    title: "Association Salim ODV - Blog - Un 2024 à retenir"
    description: "Un 2024 à retenir"
  header:
    title: "Un 2024 à retenir"
    date: "16 février 2025"
    subtitle: "Voici comment vos contributions ont fait la différence"
  highlights:
    title: "Points forts"
    children_families: "enfants et familles soutenus"
    essential_goods: "en biens de première nécessité"
    enrolled_private: "enfants inscrits dans des écoles privées"
    christmas_project: "investis dans le projet de Noël"
  intro:
    p1: "Le début de l'année est un bon moment pour faire le bilan : voir clairement ce qui a été accompli donne de la perspective pour bien visualiser ce que l'on veut encore réaliser et tracer le chemin vers les objectifs que l'on se fixe."
    p2_1: "Au cours des cinq mois d'août à décembre 2024, grâce à vous tous, nous avons travaillé sans relâche pour améliorer la vie des enfants et des familles dans sept villages du Kenya."
    p2_2: "Votre générosité, combinée au travail acharné des bénévoles et de tous les membres, a conduit à des résultats très importants que nous voulons partager avec vous en toute transparence."
    p2_3: "Nous présentons les données en euros plutôt qu'en shillings kényans pour faciliter la lecture."
  distribution:
    title: "Distribution de nourriture et de produits essentiels"
    description: "Nous avons fourni un soutien vital à un total de 70 enfants et leurs familles, pour un total de 12 217 €."
    svg_title: "Distribution de biens essentiels 2024"
    svg_total: "Total investi : 12 217 €"
    basic_foods: "Aliments de base"
    flour: "Farine"
    fish: "Poisson"
    noodle_packs: "Paquets de nouilles"
    vegetables_potatoes: "Légumes et pommes de terre"
    milk: "Lait"
    rice: "Riz"
    legumes: "Légumineuses"
    biscuit_packs: "Paquets de biscuits"
    also_distributed: "Ont également été distribués"
    sanitary_pads: "Plus de 1 000 serviettes hygiéniques"
    clothing: "Vêtements"
    shoes: "Chaussures"
    underwear: "Sous-vêtements"
    img_alt_1: "Image de sacs de nourriture sur terre rouge. Un mur de briques en arrière-plan."
    img_alt_2: "Image de sacs de nourriture sur terre rouge. Un mur de briques en arrière-plan."
  education:
    title: "Frais de scolarité publiques et privées"
    p1: "S'il y a une chose dont nous sommes convaincus, c'est que l'éducation peut faire la différence dans la vie de ceux qui n'ont pas grand-chose."
    p2: "En 2024, 965 € ont été alloués au paiement des frais de scolarité de l'école primaire publique et du matériel éducatif nécessaire. Un donateur a couvert les frais de l'école secondaire publique d'une fille pour 303 €."
    p3: "Actuellement, 13 enfants sont inscrits pour 2025 dans des écoles privées pour un total de 6 990,50 €, dont 3 290 € ont déjà été versés lors d'un premier versement en janvier."
    total: "Total"
    legend_primary_public: "École Primaire Publique (965 €)"
    legend_secondary_public: "École Secondaire Publique (303 €)"
    legend_private_paid: "Écoles Privées - déjà payé (3 290 €)"
    legend_private_pending: "Écoles Privées - à payer (3 700,50 €)"
    img_alt: "Enfants le matin prêts pour l'école à Kwale"
  kilifi:
    title: "Projet Kilifi"
    p1: "En septembre, nous avons partagé avec vous tous l'opportunité de soutenir un groupe de vingt enfants orphelins dans le village de Tezo (dans le comté de Kilifi), que nous avons rencontrés grâce à un contact local."
    p2: "Beaucoup de ces enfants n'ont aucun bien essentiel, et certains, privés non seulement de parents mais aussi de proches, sont confiés aux soins des voisins."
    p3: "À ce jour, nous avons réussi à trouver un soutien pour 3 enfants. Le besoin est encore grand. Nous recherchons davantage de donateurs réguliers pour assurer un avenir stable aux autres orphelins encore sans soutien."
  christmas:
    title: "Projet de Noël 2024"
    intro: "Pendant la période de Noël, votre générosité nous a permis d'acheter :"
    mattresses: "Matelas"
    pillows: "Oreillers"
    gift_for_all: "Cadeau pour tous"
    school_set: "Kit Scolaire"
    animals: "Animaux"
    total: "Total"
    img_alt: "Distribution du deuxième colis de Noël à l'un des enfants soutenus à Kwale"
    p_final: "En raison de difficultés d'approvisionnement, les kits \"cadeau pour tous\" et les animaux seront livrés dès que possible. Tous les autres cadeaux de Noël ont été livrés comme prévu."
  future:
    title: "Maintenant que nous avons fait le point, regardons VERS L'AVANT"
    p1: "Nous faisons partie d'un projet qui peut potentiellement croître énormément, et nous l'espérons, pour le bien de tous les enfants qui pourront bénéficier de tout cela !"
    p2_1: "C'est pourquoi"
    p2_underline: "nous vous voulons dans l'équipe"
    p2_2: " : si vous aimez notre façon de travailler, si vous voulez nous aider concrètement avec votre savoir et vos actions, avec vos idées, avec la collecte de fonds, vous faites déjà partie de l'équipe ! Pensez alors à"
    p2_link: "devenir membre"
    p2_3: " : avec une cotisation de 40 euros, vous aiderez davantage l'association à soutenir l'ensemble de son travail et vous aurez votre mot à dire lors des réunions annuelles où les prochains projets sont présentés. Construisons ensemble Salim !"
    p3: "Et en 2025, nous vous demandons un petit engagement supplémentaire : parlez de Salim à vos amis et à votre famille, de votre expérience avec nous, de la transparence à laquelle Jessica vous a habitués et que nous continuons d'adopter comme vision de l'ensemble du projet. Nous avons de grands objectifs en tête, mais nous avons besoin que Salim grandisse pour les atteindre. Nous serons à vos côtés, vous fournissant tout le soutien dont nous sommes capables pour vous aider à faire ces petits gestes qui porteront de grands fruits dans la vie de ceux qui ont moins."
    p4_1: "Merci du fond du cœur, et en avant toute, toujours ensemble."
    p4_2: "Bonne année 2025, qu'elle apporte une abondance de fruits !"

# Article: 31-marzo-2026
art_31_marzo_2026:
  meta:
    title: "Association Salim ODV - Blog - Une année 2025 de croissance et d'aide concrète"
    description: "Une année 2025 de croissance et d'aide concrète"
  header:
    title: "Une année 2025 de croissance et d'aide concrète"
    date: "31 mars 2026"
    subtitle: "Voici comment nous avons utilisé vos contributions au cours de la première année à plein régime de l'association"
  highlights:
    title: "Points forts"
    families: "familles soutenues"
    essential_goods: "en biens de première nécessité"
    children_school: "enfants soutenus à l'école"
    special_projects: "en projets spéciaux"
  intro:
    p1: "L'année 2025 a été pour Salim ODV la <strong>première année d'activité à plein régime</strong> : nous avons pu opérer en continu, avec un plan d'intervention plus structuré et un suivi plus attentif des besoins des familles et des enfants avec lesquels nous collaborons au Kenya."
    p2: "Grâce à votre confiance et à la générosité de nos soutiens, nous avons accompagné un total de <strong>74 familles</strong> et distribué des ressources et des services de manière équitable, ciblée et transparente."
  essential_goods:
    title: "Biens de première nécessité — 30 575 €"
    description: "Pour garantir subsistance, nutrition et dignité aux familles, nous avons distribué des denrées alimentaires et des produits essentiels pour la vie quotidienne. Pour donner quelques exemples :"
    flour: "9 330 kg de farine"
    fruit_veg: "5 700 kg de fruits et légumes"
    fish: "2 730 kg de poisson"
    pasta_rice: "3 070 kg de pâtes et de riz"
    closing: "…et bien d'autres biens distribués dans les villages."
    p2: "Ces produits ont été essentiels pour soulager les difficultés de nombreuses familles, en garantissant des repas nutritifs et une continuité alimentaire."
  clothing_hygiene:
    title: "Vêtements et produits d'hygiène — 12 205 €"
    description: "Le soutien ne s'est pas limité à la nourriture. Nous avons distribué :"
    clothes: "Des vêtements neufs et d'occasion, que nous n'avons pas pu quantifier objectivement en nombre"
    pads: "2 600 serviettes hygiéniques, pour répondre à un besoin concret et souvent négligé"
    soap: "315 kits de savons pour l'hygiène personnelle et le linge, essentiels pour l'hygiène quotidienne"
    reason_intro: "Pour ceux qui se demanderaient pourquoi nous optons aussi pour la distribution de vêtements neufs, les raisons sont essentiellement deux :"
    reason_logistics: "<strong>Logistique</strong> : envoyer des biens en Afrique par conteneur est très coûteux et il n'est pas toujours certain que la marchandise arrive à destination ; c'est pourquoi nous cherchons à exploiter la capacité de chargement aérien de nos bénévoles à chaque voyage."
    reason_local: "<strong>Soutien à l'économie locale</strong> : nous croyons que ceux qui produisent localement doivent avoir la possibilité de subvenir à leurs besoins et nous favorisons l'emploi de main-d'œuvre et de couturières locales."
  education:
    title: "Matériel scolaire et frais de scolarité — 8 837 €"
    p1: "Nous croyons que l'<strong>éducation est un outil clé pour l'avenir</strong>. En 2025, nous avons soutenu <strong>14 enfants</strong> avec :"
    fees: "Frais de scolarité à l'école privée"
    materials: "Livres, cahiers, fournitures scolaires, atlas, encyclopédies et dictionnaires"
    closing: "Ces matériels ne sont pas de simples outils d'apprentissage : ce sont les clés pour ouvrir de nouvelles perspectives et de nouveaux espoirs dans la vie de chaque élève."
  special_projects:
    title: "Projets spéciaux — 2 830 €"
    intro: "Nous souhaitons accorder une attention particulière aux <strong>projets spéciaux</strong> lancés au cours de l'année."
  medical:
    title: "Bilan de santé général"
    p1: "Pour Noël, nous avons proposé quelque chose de <strong>complètement nouveau</strong> par rapport aux années précédentes : un bilan de santé complet pour nos enfants, avec l'objectif de <strong>vérifier leur santé de manière approfondie</strong>."
    p2: "Sur les <strong>16 enfants concernés</strong>, <strong>10 ont eu besoin d'examens complémentaires et de soins médicaux</strong>."
    p3: "Parmi eux, <strong>1 enfant a obtenu la possibilité d'accéder gratuitement à un programme d'intervention chirurgicale avec Operation Smile</strong>, ce qui lui permettra de <strong>parler correctement pour la première fois de sa vie</strong>."
    social_note: "Ceux qui souhaitent mieux connaître son histoire peuvent trouver plus de détails sur nos pages de réseaux sociaux."
    p4: "La prise de conscience de la précarité de leur santé — pas toujours visible de l'extérieur — nous a amenés à <strong>inclure le bilan de santé parmi les projets permanents</strong> d'assistance."
    p5: "Dès aujourd'hui, vous pouvez offrir un <em>\"bilan de santé en attente\"</em> pour un enfant et devenir un acteur actif de son parcours de santé."
  haller:
    title: "Visite à l'Haller Park"
    p1: "L'autre grande expérience de Noël a été la <strong>visite à l'Haller Park</strong>, le parc animalier de Mombasa."
    p2: "La plupart des enfants <strong>n'avaient jamais quitté leur village ni vu une grande ville</strong>. Cette sortie éducative n'a pas été qu'un divertissement :"
    bullet1: "elle a stimulé la <strong>curiosité et l'ouverture d'esprit</strong> des enfants"
    bullet2: "elle leur a permis de se confronter à de nouveaux environnements"
    bullet3: "elle a favorisé un <strong>apprentissage direct à travers la nature et les animaux</strong>, créant des souvenirs durables qui renforcent l'estime de soi et les relations sociales"
    closing: "Ces expériences éducatives sont essentielles pour élargir les horizons des enfants et les aider à construire la confiance en eux-mêmes et en leurs rêves."
  outlook:
    title: "Perspectives et projets pour 2026"
  solidarity_gifts:
    title: "Cadeaux solidaires — Donner pour partager"
    p1: "Poussés par l'idée de promouvoir Salim ODV lors d'un marché de village, nous avons lancé un concept artisanal qui reflète l'esprit de notre mission. L'accueil de cette idée a été si chaleureux que nous avons décidé de <strong>la développer en un projet permanent</strong> :"
    p2: "Des cadeaux solidaires pour des occasions comme les <strong>mariages, confirmations, remises de diplômes, cadeaux de fin d'année aux enseignants et aux employés</strong>..."
    p3: "Il s'agit de <strong>propositions uniques faites à la main</strong>, conçues pour être <strong>quelque chose de tangible que vous pouvez partager avec vos amis et vos proches</strong>, en racontant l'histoire de Salim tout en soutenant un projet concret."
    p4: "Contactez-nous pour élaborer ensemble votre proposition sur mesure, et vous trouverez bientôt une section dédiée sur notre site."
  solidarity_trips:
    title: "Voyages solidaires"
    p1: "Avez-vous déjà pensé à vivre une expérience au Kenya en contact direct avec les réalités rurales des villages ? Aimeriez-vous <strong>toucher du doigt l'impact des projets de Salim</strong>, rencontrer les familles soutenues et comprendre vraiment ce que signifie travailler sur le terrain ?"
    p2: "En 2026, nous souhaitons ouvrir nos portes à ceux qui désirent vivre une expérience de <strong>bénévolat et d'immersion dans la culture kényane</strong>, accompagnés par ceux qui connaissent profondément ces lieux."
    p3: "<strong>Jessica et Salimu</strong> seront prêts à vous accueillir et à vous guider dans un parcours authentique : entre villages, projets actifs et moments de partage réel, avec le soutien d'une longue expérience dans l'accueil et l'organisation de safaris responsables."
    p4: "Ce n'est pas un simple voyage, mais une expérience qui laisse des traces — en vous et autour de vous."
  health_project:
    title: "Projet \"Santé en Attente\""
    p1: "L'expérience des bilans de santé de 2025 nous a ouvert les yeux sur une réalité souvent invisible : <strong>la fragilité de la santé des enfants</strong>, même lorsqu'en apparence ils semblent aller bien."
    p2: "C'est pourquoi nous avons décidé de pérenniser le projet <strong>\"Santé en Attente\"</strong>, déjà lancé avec les bilans de Noël."
    p3: "Dès aujourd'hui, il est possible d'<strong>offrir un bilan de santé en attente</strong> à un enfant, en contribuant de manière directe et concrète à la prévention, au diagnostic précoce et aux soins."
    p4: "Un geste simple qui peut changer radicalement l'avenir d'un enfant."
    link_text: "Découvrir le projet Bilan de santé"
  thanks:
    title: "Merci du fond du cœur"
    p1: "Tous ces résultats ne sont possibles que <strong>grâce à vous</strong> : à votre confiance, à votre soutien et à votre proximité. Partager les fruits de notre travail en toute <strong>transparence et responsabilité</strong> est une valeur fondamentale pour Salim ODV, car nous croyons que chaque donateur doit savoir comment sa contribution arrive et se transforme en fruit dans la vie de ceux qui la reçoivent."

