# Blog articles translations

# Article: 25-gennaio-2025
art_25_gennaio_2025:
  meta:
    title: "Associazione Salim ODV - Blog - Salim Odv partecipa a \"Conversescion\""
    description: "Intervista con Salim Odv"
  header:
    title: "Salim Odv partecipa a \"Conversescion\""
    date: "25 Gennaio 2025"
  content:
    intro_p1: "Sara (il presidente) e Carlo (il tesoriere) hanno avuto l'opportunità di intervenire nel programma radiofonico \"Conversescion\" di Ciao Como Radio e di presentare il lavoro dell'associazione."
    intro_p2: "È stata una bellissima esperienza, e siamo pronti e carichi per ripetere l'esperienza in altre emittenti… stay tuned!"
    intro_p3: "Qui l'intervista integrale"

# Article: 14-febbraio-2025
art_14_febbraio_2025:
  meta:
    title: "Associazione Salim ODV - Blog - Un 2024 da ricordare"
    description: "Un 2024 da ricordare"
  header:
    title: "Un 2024 da ricordare"
    date: "16 Febbraio 2025"
    subtitle: "Ecco come i vostri contributi hanno fatto la differenza"
  highlights:
    title: "In evidenza"
    children_families: "bambini e famiglie supportate"
    essential_goods: "in beni di prima necessità"
    enrolled_private: "bambini iscritti alle scuole private"
    christmas_project: "investiti nel progetto natalizio"
  intro:
    p1: "L'inizio dell'anno è un buon momento per tirare le somme: vedere con chiarezza ciò che si è riusciti a realizzare dona prospettiva per visualizzare bene ciò che ancora si vuole realizzare e tracciare la strada verso gli obiettivi che ci si pone."
    p2_1: "Nei cinque mesi da agosto a dicembre 2024, grazie a tutti voi, abbiamo lavorato instancabilmente per migliorare la vita dei bambini e delle famiglie in sette villaggi del Kenya."
    p2_2: "La vostra generosità, unita all'operosità dei volontari e di tutti i soci, ha portato a dei risultati importantissimi che vogliamo condividere con voi in tutta trasparenza."
    p2_3: "Riportiamo i dati in Euro e non in Scellini kenioti per facilità di lettura."
  distribution:
    title: "Distribuzione di cibo e prodotti essenziali"
    description: "Abbiamo fornito un supporto vitale a un totale di 70 bambini e alle loro famiglie, per un totale di 12.217 €."
    svg_title: "Distribuzione di beni essenziali 2024"
    svg_total: "Totale investito: 12.217 €"
    basic_foods: "Alimenti base"
    flour: "Farina"
    fish: "Pesce"
    noodle_packs: "Confezioni di noodles"
    vegetables_potatoes: "Verdure e patate"
    milk: "Latte"
    rice: "Riso"
    legumes: "Legumi"
    biscuit_packs: "Confezioni di biscotti"
    also_distributed: "Sono stati anche distribuiti"
    sanitary_pads: "Oltre 1.000 assorbenti"
    clothing: "Vestiario"
    shoes: "Scarpe"
    underwear: "Intimo"
    img_alt_1: "Immagine di sacchi di cibo su terra rossa. Un muro di mattoni nello sfondo."
    img_alt_2: "Immagine di sacchi di cibo su terra rossa. Un muro di mattoni nello sfondo."
  education:
    title: "Rette scolastiche pubbliche e private"
    p1: "Se c'è una cosa di cui siamo convinti è che l'istruzione possa fare la differenza nella vita di coloro che non hanno molto."
    p2: "Nel 2024, 965 € sono stati destinati al pagamento delle rette scolastiche della scuola pubblica primaria e dei materiali necessari all'istruzione. Un sostenitore ha coperto i costi per la scuola secondaria pubblica di una ragazza per 303 €."
    p3: "Attualmente i bambini iscritti per il 2025 alle scuole private sono 13 per un totale di 6990,50 €, di questi sono stati già versati 3290 € in una prima tranche a Gennaio."
    total: "Totale"
    legend_primary_public: "Scuola Primaria Pubblica (€ 965)"
    legend_secondary_public: "Scuola Secondaria Pubblica (€ 303)"
    legend_private_paid: "Scuole Private - già versato (€ 3.290)"
    legend_private_pending: "Scuole Private - da versare (€ 3.700,50)"
    img_alt: "Bambini al mattino pronti per la scuola a Kwale"
  kilifi:
    title: "Progetto Kilifi"
    p1: "In settembre abbiamo condiviso con tutti voi l'opportunità di sostenere un gruppo di venti bambini orfani nel villaggio di Tezo (nella contea di Kilifi), conosciuti grazie a un contatto locale."
    p2: "Molti di questi bambini non hanno alcun bene essenziale, e alcuni, privi non solo dei genitori, ma anche di parenti, sono affidati alla cura dei vicini."
    p3: "Ad oggi siamo riusciti a trovare il sostegno per 3 bambini. Il bisogno è ancora grande. Cerchiamo ulteriori sostenitori fissi per garantire un futuro stabile agli altri orfani ancora senza supporto."
  christmas:
    title: "Progetto di Natale 2024"
    intro: "Durante il periodo natalizio, la vostra generosità ci ha permesso di acquistare:"
    mattresses: "Materassi"
    pillows: "Cuscini"
    gift_for_all: "Regalo x tutti"
    school_set: "Set Scuola"
    animals: "Animali"
    total: "Totale"
    img_alt: "Distribuzione del secondo pacchetto natalizio a uno dei bambini sostenuti a Kwale"
    p_final: "Per difficoltà di approvvigionamento, i set \"regalo per tutti\" e gli animali verranno consegnati appena sarà possibile. Gli altri doni natalizi sono stati tutti consegnati regolarmente."
  future:
    title: "Ora che abbiamo fatto il punto, guardiamo AVANTI"
    p1: "Siamo parte di un progetto che potenzialmente può crescere a dismisura, e ce lo auguriamo, per il bene di tutti i bambini che potranno beneficiare di tutto questo!"
    p2_1: "Per questo"
    p2_underline: "ti vogliamo nella squadra"
    p2_2: ": se ti piace il nostro modo di lavorare, vuoi aiutarci in maniera pratica con il tuo sapere e con il tuo fare, con le tue idee, con la raccolta fondi, sei già parte del team! Considera allora di"
    p2_link: "diventare socio"
    p2_3: ": con una quota di 40 euro aiuterai ulteriormente l'associazione nel sostegno dell'opera tutta e potrai avere voce in capitolo nelle riunioni annuali dove vengono presentati i prossimi progetti. Costruiamo insieme Salim!"
    p3: "E in questo 2025 vi chiediamo un ulteriore, piccolo impegno: parlate ai vostri amici e parenti di Salim, della vostra esperienza con noi, della trasparenza alla quale Jessica vi ha abituato e che stiamo continuando a sposare come visione dell'intero progetto. Abbiamo grandi mete in mente, ma abbiamo bisogno che Salim cresca per poterle raggiungere. Noi saremo al vostro fianco, fornendovi tutto il supporto di cui siamo capaci per aiutarvi a fare quei piccoli gesti che porteranno grandi frutti nelle vite di coloro che hanno meno."
    p4_1: "Grazie di cuore, e avanti tutta, sempre insieme."
    p4_2: "Buon 2025, che porti abbondanza di frutti!"

# Article: 31-marzo-2026
art_31_marzo_2026:
  meta:
    title: "Associazione Salim ODV - Blog - Un 2025 di crescita e di aiuto concreto"
    description: "Un 2025 di crescita e di aiuto concreto"
  header:
    title: "Un 2025 di crescita e di aiuto concreto"
    date: "31 Marzo 2026"
    subtitle: "Ecco come abbiamo impiegato i vostri contributi nel primo anno a pieno regime dell'associazione"
  highlights:
    title: "In evidenza"
    families: "famiglie supportate"
    essential_goods: "in beni di prima necessità"
    children_school: "bambini sostenuti a scuola"
    special_projects: "in progetti speciali"
  intro:
    p1: "Il 2025 è stato per Salim ODV il <strong>primo anno di attività a pieno regime</strong>: abbiamo potuto operare con continuità, con un piano di intervento più strutturato e un monitoraggio più attento dei bisogni delle famiglie e dei bambini con cui collaboriamo in Kenya."
    p2: "Grazie alla vostra fiducia e alla generosità dei nostri sostenitori, abbiamo supportato un totale di <strong>74 famiglie</strong> e distribuito risorse e servizi in modo equo, mirato e trasparente."
  essential_goods:
    title: "Beni di prima necessità — 30.575 €"
    description: "Per garantire sostentamento, nutrizione e dignità alle famiglie abbiamo distribuito generi alimentari e prodotti fondamentali per la vita quotidiana. Solo per dare alcuni esempi:"
    flour: "9.330 kg di farina"
    fruit_veg: "5.700 kg di frutta e verdura"
    fish: "2.730 kg di pesce"
    pasta_rice: "3.070 kg di pasta e riso"
    closing: "…e molti altri beni distribuiti nei villaggi."
    p2: "Questi prodotti sono stati fondamentali per alleviare le difficoltà di tante famiglie, garantendo pasti nutrienti e continuità alimentare."
  clothing_hygiene:
    title: "Vestiti e prodotti di igiene — 12.205 €"
    description: "Il sostegno non si è fermato al cibo. Abbiamo distribuito:"
    clothes: "Vestiti nuovi e usati, che non siamo riusciti a quantificare oggettivamente in numero"
    pads: "2.600 assorbenti, per rispondere a un bisogno concreto e spesso trascurato"
    soap: "315 set di saponi per la cura personale e biancheria, fondamentali per l'igiene quotidiana"
    reason_intro: "Per chi chiedesse come mai optiamo anche per distribuire vestiario nuovo, i motivi sono sostanzialmente due:"
    reason_logistics: "<strong>Logistico</strong>: inviare beni in Africa con dei container è molto costoso e non è sempre certo che la merce arrivi a destinazione; per questo cerchiamo di sfruttare la capacità di carico via aereo dei nostri volontari ad ogni viaggio."
    reason_local: "<strong>Sostegno dell'economia locale</strong>: crediamo che chi produce localmente debba avere la possibilità di sostentarsi e favoriamo l'impiego di manodopera e sarte locali."
  education:
    title: "Materiali scolastici e tasse scolastiche — 8.837 €"
    p1: "Crediamo che l'<strong>istruzione sia uno strumento chiave per il futuro</strong>. Nel 2025 abbiamo sostenuto <strong>14 bambini</strong> con:"
    fees: "Tasse scolastiche alla scuola privata"
    materials: "Libri, quaderni, articoli di cancelleria, atlanti, enciclopedie e dizionari"
    closing: "Questi materiali non sono solo strumenti di apprendimento: sono le chiavi per aprire nuove prospettive e speranze nella vita di ogni studente."
  special_projects:
    title: "Progetti speciali — 2.830 €"
    intro: "Un'attenzione particolare vogliamo dedicarla ai <strong>progetti speciali</strong> avviati nel corso dell'anno."
  medical:
    title: "Check-up medico generale"
    p1: "Per Natale abbiamo proposto qualcosa di <strong>completamente nuovo</strong> rispetto agli anni precedenti: un check-up medico completo per i nostri bambini, con l'obiettivo di <strong>verificare la loro salute in modo approfondito</strong>."
    p2: "Dei <strong>16 bambini coinvolti</strong>, <strong>10 hanno avuto bisogno di esami di approfondimento e cure mediche</strong>."
    p3: "Tra questi, <strong>1 bambino ha ottenuto l'opportunità di accedere gratuitamente a un programma di intervento chirurgico con Operation Smile</strong>, che gli consentirà di <strong>parlare correttamente per la prima volta in vita sua</strong>."
    social_note: "Chi volesse conoscere meglio la sua storia può trovare maggiori dettagli sulle nostre pagine social."
    p4: "La presa di coscienza della precarietà della loro salute — non sempre visibile a uno sguardo esterno — ci ha portati a <strong>includere il check-up medico tra i progetti stabili</strong> di assistenza."
    p5: "Da oggi puoi regalare un <em>\"check-up sospeso\"</em> per un bambino e diventare parte attiva nel suo percorso di salute."
  haller:
    title: "Visita all'Haller Park"
    p1: "L'altra grande esperienza natalizia è stata la <strong>visita all'Haller Park</strong>, il parco animali di Mombasa."
    p2: "I bambini, per la maggior parte, <strong>non avevano mai lasciato il loro villaggio o visto una grande città</strong>. Questa uscita formativa non è stata solo divertimento:"
    bullet1: "ha stimolato la <strong>curiosità e l'apertura mentale</strong> dei ragazzi"
    bullet2: "ha permesso loro di confrontarsi con ambienti nuovi"
    bullet3: "ha favorito <strong>apprendimento diretto attraverso la natura e gli animali</strong>, creando ricordi duraturi che supportano l'autostima e le relazioni sociali"
    closing: "Queste esperienze formative sono fondamentali per allargare gli orizzonti dei bambini e aiutarli a costruire fiducia in se stessi e nei loro sogni."
  outlook:
    title: "Prospettive e progetti per il 2026"
  solidarity_gifts:
    title: "Regali solidali — Donare per condividere"
    p1: "Spinti dall'idea di promuovere Salim ODV in un mercatino di paese, abbiamo lanciato un concept artigianale che riflette lo spirito della nostra missione. L'accoglienza di questa idea è stata talmente calorosa che abbiamo deciso di <strong>svilupparla in un progetto stabile</strong>:"
    p2: "Regali solidali per occasioni come <strong>matrimoni, cresime, lauree, regali di fine anno ai maestri e ai dipendenti</strong>..."
    p3: "Si tratta di <strong>proposte uniche realizzate a mano</strong>, pensate per essere <strong>qualcosa di tangibile che puoi condividere con amici e persone care</strong>, raccontando la storia di Salim mentre sostieni un progetto concreto."
    p4: "Contattaci per costruire insieme la tua proposta ad hoc, e a breve troverete una sezione dedicata sul nostro sito."
  solidarity_trips:
    title: "Viaggi solidali"
    p1: "Hai mai pensato di vivere un'esperienza in Kenya a contatto diretto con le realtà rurali dei villaggi? Ti piacerebbe <strong>toccare con mano l'impatto dei progetti di Salim</strong>, conoscere le famiglie sostenute e comprendere davvero cosa significa lavorare sul campo?"
    p2: "Nel 2026 vogliamo aprire le porte a chi desidera vivere un'esperienza di <strong>volontariato e immersione nella cultura keniota</strong>, accompagnato da chi questi luoghi li conosce profondamente."
    p3: "<strong>Jessica e Salimu</strong> saranno pronti ad accoglierti e guidarti in un percorso autentico: tra villaggi, progetti attivi e momenti di condivisione reale, con il supporto di una lunga esperienza nell'accoglienza e nell'organizzazione di safari responsabili."
    p4: "Non un semplice viaggio, ma un'esperienza che lascia il segno — dentro e fuori."
  health_project:
    title: "Progetto \"Salute Sospesa\""
    p1: "L'esperienza dei check-up medici del 2025 ci ha aperto gli occhi su una realtà spesso invisibile: <strong>la fragilità della salute dei bambini</strong>, anche quando all'apparenza sembrano stare bene."
    p2: "Per questo motivo abbiamo deciso di rendere stabile il progetto <strong>\"Salute Sospesa\"</strong>, già avviato con i check-up natalizi."
    p3: "Da oggi è possibile <strong>regalare un check-up medico sospeso</strong> a un bambino, contribuendo in modo diretto e concreto alla prevenzione, alla diagnosi precoce e alla cura."
    p4: "Un gesto semplice che può cambiare radicalmente il futuro di un bambino."
  thanks:
    title: "Grazie di cuore"
    p1: "Tutti questi risultati sono possibili <strong>solo grazie a te</strong>: alla tua fiducia, al tuo sostegno e alla tua vicinanza. Condividere i frutti del nostro lavoro in totale <strong>trasparenza e responsabilità</strong> è un valore fondamentale per Salim ODV, perché crediamo che ogni donatore debba sapere come il proprio contributo arriva e si trasforma in frutto nella vita di chi lo riceve."

