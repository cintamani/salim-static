# Article: 14-febbraio-2025
art_14_febbraio_2025:
  meta:
    title: "Salim ODV Association - Blog - A 2024 to Remember"
    description: "A 2024 to Remember"
  header:
    title: "A 2024 to Remember"
    date: "February 16, 2025"
    subtitle: "Here's how your contributions made a difference"
  highlights:
    title: "Highlights"
    children_families: "children and families supported"
    essential_goods: "in essential goods"
    enrolled_private: "children enrolled in private schools"
    christmas_project: "invested in the Christmas project"
  intro:
    p1: "The beginning of the year is a good time to take stock: seeing clearly what has been achieved provides perspective to visualize what we still want to accomplish and chart the path toward our goals."
    p2_1: "In the five months from August to December 2024, thanks to all of you, we worked tirelessly to improve the lives of children and families in seven villages in Kenya."
    p2_2: "Your generosity, combined with the hard work of volunteers and all members, has led to very important results that we want to share with you in complete transparency."
    p2_3: "We report the data in Euros rather than Kenyan Shillings for ease of reading."
  distribution:
    title: "Distribution of food and essential products"
    description: "We provided vital support to a total of 70 children and their families, for a total of €12,217."
    svg_title: "Distribution of essential goods 2024"
    svg_total: "Total invested: €12,217"
    basic_foods: "Basic foods"
    flour: "Flour"
    fish: "Fish"
    noodle_packs: "Noodle packages"
    vegetables_potatoes: "Vegetables and potatoes"
    milk: "Milk"
    rice: "Rice"
    legumes: "Legumes"
    biscuit_packs: "Biscuit packages"
    also_distributed: "Also distributed"
    sanitary_pads: "Over 1,000 sanitary pads"
    clothing: "Clothing"
    shoes: "Shoes"
    underwear: "Underwear"
    img_alt_1: "Image of food sacks on red earth. A brick wall in the background."
    img_alt_2: "Image of food sacks on red earth. A brick wall in the background."
  education:
    title: "Public and private school fees"
    p1: "If there's one thing we are convinced of, it's that education can make a difference in the lives of those who don't have much."
    p2: "In 2024, €965 was allocated to paying public primary school fees and necessary educational materials. One supporter covered the costs for a girl's public secondary school for €303."
    p3: "Currently, 13 children are enrolled for 2025 in private schools for a total of €6,990.50, of which €3,290 has already been paid in a first installment in January."
    total: "Total"
    legend_primary_public: "Public Primary School (€965)"
    legend_secondary_public: "Public Secondary School (€303)"
    legend_private_paid: "Private Schools - already paid (€3,290)"
    legend_private_pending: "Private Schools - to be paid (€3,700.50)"
    img_alt: "Children in the morning ready for school in Kwale"
  kilifi:
    title: "Kilifi Project"
    p1: "In September, we shared with all of you the opportunity to support a group of twenty orphaned children in the village of Tezo (in Kilifi County), whom we met through a local contact."
    p2: "Many of these children have no essential goods, and some, lacking not only parents but also relatives, are entrusted to the care of neighbors."
    p3: "To date, we have managed to find support for 3 children. The need is still great. We are looking for more regular supporters to ensure a stable future for the other orphans still without support."
  christmas:
    title: "Christmas Project 2024"
    intro: "During the Christmas season, your generosity allowed us to purchase:"
    mattresses: "Mattresses"
    pillows: "Pillows"
    gift_for_all: "Gift for all"
    school_set: "School Set"
    animals: "Animals"
    total: "Total"
    img_alt: "Distribution of the second Christmas package to one of the supported children in Kwale"
    p_final: "Due to supply difficulties, the \"gift for all\" sets and animals will be delivered as soon as possible. All other Christmas gifts were delivered on schedule."
  future:
    title: "Now that we've taken stock, let's look FORWARD"
    p1: "We are part of a project that can potentially grow enormously, and we hope it will, for the benefit of all the children who can benefit from all of this!"
    p2_1: "That's why"
    p2_underline: "we want you on the team"
    p2_2: ": if you like how we work, want to help us practically with your knowledge and actions, with your ideas, with fundraising, you're already part of the team! Consider then"
    p2_link: "becoming a member"
    p2_3: ": with a €40 fee you will further help the association in supporting all its work and you will have a say in the annual meetings where upcoming projects are presented. Let's build Salim together!"
    p3: "And in 2025 we ask you for one more small commitment: talk to your friends and family about Salim, about your experience with us, about the transparency that Jessica has accustomed you to and that we continue to embrace as the vision of the entire project. We have great goals in mind, but we need Salim to grow to achieve them. We will be by your side, providing you with all the support we can to help you make those small gestures that will bring great fruits in the lives of those who have less."
    p4_1: "Thank you from the bottom of our hearts, and full steam ahead, always together."
    p4_2: "Happy 2025, may it bring an abundance of fruits!"

# Article: 31-marzo-2026
art_31_marzo_2026:
  meta:
    title: "Salim ODV Association - Blog - A 2025 of Growth and Concrete Help"
    description: "A 2025 of Growth and Concrete Help"
  header:
    title: "A 2025 of Growth and Concrete Help"
    date: "March 31, 2026"
    subtitle: "Here's how we used your contributions in the association's first full year of operation"
  highlights:
    title: "Highlights"
    families: "families supported"
    essential_goods: "in essential goods"
    children_school: "children supported in school"
    special_projects: "in special projects"
  intro:
    p1: "2025 was Salim ODV's <strong>first full year of operation</strong>: we were able to work continuously, with a more structured intervention plan and closer monitoring of the needs of the families and children we work with in Kenya."
    p2: "Thanks to your trust and the generosity of our supporters, we supported a total of <strong>74 families</strong> and distributed resources and services in a fair, targeted, and transparent manner."
  essential_goods:
    title: "Essential goods — €30,575"
    description: "To ensure sustenance, nutrition, and dignity for the families, we distributed food and essential products for daily life. Just to give a few examples:"
    flour: "9,330 kg of flour"
    fruit_veg: "5,700 kg of fruit and vegetables"
    fish: "2,730 kg of fish"
    pasta_rice: "3,070 kg of pasta and rice"
    closing: "…and many other goods distributed across the villages."
    p2: "These products were essential in alleviating the hardships of many families, ensuring nutritious meals and food security."
  clothing_hygiene:
    title: "Clothing and hygiene products — €12,205"
    description: "Our support didn't stop at food. We also distributed:"
    clothes: "New and used clothing, which we were unable to objectively quantify in number"
    pads: "2,600 sanitary pads, addressing a real and often overlooked need"
    soap: "315 soap sets for personal care and laundry, essential for daily hygiene"
    reason_intro: "For those wondering why we also choose to distribute new clothing, there are essentially two reasons:"
    reason_logistics: "<strong>Logistics</strong>: shipping goods to Africa by container is very expensive and there is no guarantee the items will reach their destination; that's why we make the most of the cargo capacity available on our volunteers' flights."
    reason_local: "<strong>Supporting the local economy</strong>: we believe that local producers should have the opportunity to sustain themselves, and we promote the use of local labor and seamstresses."
  education:
    title: "School materials and tuition fees — €8,837"
    p1: "We believe that <strong>education is a key tool for the future</strong>. In 2025, we supported <strong>14 children</strong> with:"
    fees: "Private school tuition fees"
    materials: "Books, notebooks, stationery, atlases, encyclopedias, and dictionaries"
    closing: "These materials are not just learning tools: they are the keys to opening new perspectives and hopes in every student's life."
  special_projects:
    title: "Special projects — €2,830"
    intro: "We want to give special attention to the <strong>special projects</strong> launched during the year."
  medical:
    title: "General medical check-up"
    p1: "For Christmas, we proposed something <strong>completely new</strong> compared to previous years: a full medical check-up for our children, with the goal of <strong>thoroughly assessing their health</strong>."
    p2: "Of the <strong>16 children involved</strong>, <strong>10 needed further tests and medical treatment</strong>."
    p3: "Among them, <strong>1 child was given the opportunity to access a free surgical program with Operation Smile</strong>, which will allow him to <strong>speak properly for the first time in his life</strong>."
    social_note: "Those who would like to learn more about his story can find further details on our social media pages."
    p4: "The realization of how precarious their health is — not always visible from the outside — led us to <strong>include the medical check-up among our permanent support projects</strong>."
    p5: "From now on, you can give a <em>\"suspended check-up\"</em> for a child and become an active part of their health journey."
  haller:
    title: "Visit to Haller Park"
    p1: "The other great Christmas experience was the <strong>visit to Haller Park</strong>, the animal park in Mombasa."
    p2: "Most of the children <strong>had never left their village or seen a big city</strong>. This educational outing was not just fun:"
    bullet1: "it stimulated the children's <strong>curiosity and open-mindedness</strong>"
    bullet2: "it allowed them to experience new environments"
    bullet3: "it fostered <strong>direct learning through nature and animals</strong>, creating lasting memories that support self-esteem and social relationships"
    closing: "These educational experiences are essential for broadening children's horizons and helping them build confidence in themselves and their dreams."
  outlook:
    title: "Outlook and projects for 2026"
  solidarity_gifts:
    title: "Solidarity gifts — Giving to share"
    p1: "Driven by the idea of promoting Salim ODV at a local village market, we launched a handcrafted concept that reflects the spirit of our mission. The response was so warm that we decided to <strong>develop it into a permanent project</strong>:"
    p2: "Solidarity gifts for occasions such as <strong>weddings, confirmations, graduations, end-of-year gifts for teachers and employees</strong>..."
    p3: "These are <strong>unique handmade creations</strong>, designed to be <strong>something tangible you can share with friends and loved ones</strong>, telling the story of Salim while supporting a concrete project."
    p4: "Contact us to create your custom proposal together, and soon you'll find a dedicated section on our website."
  solidarity_trips:
    title: "Solidarity trips"
    p1: "Have you ever thought about experiencing Kenya in direct contact with the rural realities of the villages? Would you like to <strong>see firsthand the impact of Salim's projects</strong>, meet the supported families, and truly understand what it means to work in the field?"
    p2: "In 2026, we want to open our doors to those who wish to experience <strong>volunteering and immersion in Kenyan culture</strong>, accompanied by people who know these places deeply."
    p3: "<strong>Jessica and Salimu</strong> will be ready to welcome you and guide you on an authentic journey: through villages, active projects, and moments of genuine sharing, with the support of extensive experience in hospitality and organizing responsible safaris."
    p4: "Not just a trip, but an experience that leaves its mark — inside and out."
  health_project:
    title: "\"Suspended Health\" Project"
    p1: "The experience of the 2025 medical check-ups opened our eyes to an often invisible reality: <strong>the fragility of children's health</strong>, even when they appear to be doing well."
    p2: "For this reason, we decided to make the <strong>\"Suspended Health\"</strong> project permanent, which was already launched with the Christmas check-ups."
    p3: "From now on, it is possible to <strong>give a suspended medical check-up</strong> to a child, contributing directly and concretely to prevention, early diagnosis, and treatment."
    p4: "A simple gesture that can radically change a child's future."
  thanks:
    title: "Thank you from the heart"
    p1: "All these results are possible <strong>only thanks to you</strong>: your trust, your support, and your closeness. Sharing the fruits of our work in complete <strong>transparency and accountability</strong> is a core value for Salim ODV, because we believe every donor should know how their contribution arrives and transforms into fruit in the lives of those who receive it."

