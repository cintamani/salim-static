# Blog articles translations - Spanish

# Article: 25-gennaio-2025
art_25_gennaio_2025:
  meta:
    title: "Asociación Salim ODV - Blog - Salim Odv participa en \"Conversescion\""
    description: "Entrevista con Salim Odv"
  header:
    title: "Salim Odv participa en \"Conversescion\""
    date: "25 de enero de 2025"
  content:
    intro_p1: "Sara (la presidenta) y Carlo (el tesorero) tuvieron la oportunidad de participar en el programa de radio \"Conversescion\" de Ciao Como Radio y presentar el trabajo de la asociación."
    intro_p2: "Fue una experiencia maravillosa, y estamos listos y con ganas de repetirla en otras emisoras… ¡estad atentos!"
    intro_p3: "Aquí está la entrevista completa"

# Article: 14-febbraio-2025
art_14_febbraio_2025:
  meta:
    title: "Asociación Salim ODV - Blog - Un 2024 para recordar"
    description: "Un 2024 para recordar"
  header:
    title: "Un 2024 para recordar"
    date: "16 de febrero de 2025"
    subtitle: "Así es como vuestras contribuciones marcaron la diferencia"
  highlights:
    title: "Destacados"
    children_families: "niños y familias apoyados"
    essential_goods: "en bienes de primera necesidad"
    enrolled_private: "niños matriculados en escuelas privadas"
    christmas_project: "invertidos en el proyecto navideño"
  intro:
    p1: "El comienzo del año es un buen momento para hacer balance: ver con claridad lo que se ha logrado da perspectiva para visualizar bien lo que aún se quiere realizar y trazar el camino hacia los objetivos que nos proponemos."
    p2_1: "En los cinco meses de agosto a diciembre de 2024, gracias a todos vosotros, trabajamos incansablemente para mejorar la vida de los niños y las familias en siete aldeas de Kenia."
    p2_2: "Vuestra generosidad, unida al trabajo de los voluntarios y de todos los socios, ha llevado a resultados importantísimos que queremos compartir con vosotros con total transparencia."
    p2_3: "Informamos los datos en euros y no en chelines kenianos para facilitar la lectura."
  distribution:
    title: "Distribución de alimentos y productos esenciales"
    description: "Proporcionamos apoyo vital a un total de 70 niños y sus familias, por un total de 12.217 €."
    svg_title: "Distribución de bienes esenciales 2024"
    svg_total: "Total invertido: 12.217 €"
    basic_foods: "Alimentos básicos"
    flour: "Harina"
    fish: "Pescado"
    noodle_packs: "Paquetes de fideos"
    vegetables_potatoes: "Verduras y patatas"
    milk: "Leche"
    rice: "Arroz"
    legumes: "Legumbres"
    biscuit_packs: "Paquetes de galletas"
    also_distributed: "También se distribuyeron"
    sanitary_pads: "Más de 1.000 compresas"
    clothing: "Ropa"
    shoes: "Zapatos"
    underwear: "Ropa interior"
    img_alt_1: "Imagen de sacos de comida sobre tierra roja. Un muro de ladrillos al fondo."
    img_alt_2: "Imagen de sacos de comida sobre tierra roja. Un muro de ladrillos al fondo."
  education:
    title: "Matrículas escolares públicas y privadas"
    p1: "Si hay algo de lo que estamos convencidos es que la educación puede marcar la diferencia en la vida de quienes no tienen mucho."
    p2: "En 2024, 965 € se destinaron al pago de matrículas de la escuela pública primaria y de los materiales necesarios para la educación. Un colaborador cubrió los costos de la escuela secundaria pública de una niña por 303 €."
    p3: "Actualmente, hay 13 niños matriculados para 2025 en escuelas privadas por un total de 6.990,50 €, de los cuales ya se han pagado 3.290 € en una primera cuota en enero."
    total: "Total"
    legend_primary_public: "Escuela Primaria Pública (965 €)"
    legend_secondary_public: "Escuela Secundaria Pública (303 €)"
    legend_private_paid: "Escuelas Privadas - ya pagado (3.290 €)"
    legend_private_pending: "Escuelas Privadas - pendiente (3.700,50 €)"
    img_alt: "Niños por la mañana listos para la escuela en Kwale"
  kilifi:
    title: "Proyecto Kilifi"
    p1: "En septiembre compartimos con todos vosotros la oportunidad de apoyar a un grupo de veinte niños huérfanos en el pueblo de Tezo (en el condado de Kilifi), conocidos gracias a un contacto local."
    p2: "Muchos de estos niños no tienen ningún bien esencial, y algunos, sin padres ni parientes, están al cuidado de los vecinos."
    p3: "Hasta la fecha hemos conseguido encontrar apoyo para 3 niños. La necesidad sigue siendo grande. Buscamos más colaboradores fijos para garantizar un futuro estable a los demás huérfanos aún sin apoyo."
  christmas:
    title: "Proyecto de Navidad 2024"
    intro: "Durante el período navideño, vuestra generosidad nos permitió comprar:"
    mattresses: "Colchones"
    pillows: "Almohadas"
    gift_for_all: "Regalo para todos"
    school_set: "Set Escolar"
    animals: "Animales"
    total: "Total"
    img_alt: "Distribución del segundo paquete navideño a uno de los niños apoyados en Kwale"
    p_final: "Por dificultades de abastecimiento, los sets de \"regalo para todos\" y los animales se entregarán lo antes posible. Los demás regalos navideños se entregaron según lo programado."
  future:
    title: "Ahora que hemos hecho balance, miremos ADELANTE"
    p1: "¡Somos parte de un proyecto que potencialmente puede crecer enormemente, y lo deseamos, por el bien de todos los niños que podrán beneficiarse de todo esto!"
    p2_1: "Por eso"
    p2_underline: "te queremos en el equipo"
    p2_2: ": si te gusta nuestra forma de trabajar, quieres ayudarnos de manera práctica con tu saber y tu hacer, con tus ideas, con la recaudación de fondos, ¡ya eres parte del equipo! Considera entonces"
    p2_link: "hacerte socio"
    p2_3: ": con una cuota de 40 euros ayudarás aún más a la asociación en el apoyo de toda la obra y podrás opinar en las reuniones anuales donde se presentan los próximos proyectos. ¡Construyamos juntos Salim!"
    p3: "Y en este 2025 os pedimos un pequeño compromiso adicional: hablad a vuestros amigos y familiares de Salim, de vuestra experiencia con nosotros, de la transparencia a la que Jessica os ha acostumbrado y que seguimos adoptando como visión de todo el proyecto. Tenemos grandes metas en mente, pero necesitamos que Salim crezca para alcanzarlas. Estaremos a vuestro lado, proporcionándoos todo el apoyo del que somos capaces para ayudaros a hacer esos pequeños gestos que traerán grandes frutos en las vidas de quienes tienen menos."
    p4_1: "Gracias de corazón, y adelante a toda máquina, siempre juntos."
    p4_2: "¡Feliz 2025, que traiga abundancia de frutos!"

# Article: 31-marzo-2026
art_31_marzo_2026:
  meta:
    title: "Asociación Salim ODV - Blog - Un 2025 de crecimiento y ayuda concreta"
    description: "Un 2025 de crecimiento y ayuda concreta"
  header:
    title: "Un 2025 de crecimiento y ayuda concreta"
    date: "31 de marzo de 2026"
    subtitle: "Así es como hemos empleado vuestras contribuciones en el primer año a pleno régimen de la asociación"
  highlights:
    title: "Destacados"
    families: "familias apoyadas"
    essential_goods: "en bienes de primera necesidad"
    children_school: "niños apoyados en la escuela"
    special_projects: "en proyectos especiales"
  intro:
    p1: "El 2025 fue para Salim ODV el <strong>primer año de actividad a pleno régimen</strong>: pudimos operar con continuidad, con un plan de intervención más estructurado y un seguimiento más atento de las necesidades de las familias y los niños con los que colaboramos en Kenya."
    p2: "Gracias a vuestra confianza y a la generosidad de nuestros colaboradores, hemos apoyado a un total de <strong>74 familias</strong> y distribuido recursos y servicios de manera equitativa, específica y transparente."
  essential_goods:
    title: "Bienes de primera necesidad — 30.575 €"
    description: "Para garantizar sustento, nutrición y dignidad a las familias, hemos distribuido alimentos y productos fundamentales para la vida cotidiana. Solo por dar algunos ejemplos:"
    flour: "9.330 kg de harina"
    fruit_veg: "5.700 kg de frutas y verduras"
    fish: "2.730 kg de pescado"
    pasta_rice: "3.070 kg de pasta y arroz"
    closing: "…y muchos otros bienes distribuidos en las aldeas."
    p2: "Estos productos han sido fundamentales para aliviar las dificultades de muchas familias, garantizando comidas nutritivas y continuidad alimentaria."
  clothing_hygiene:
    title: "Ropa y productos de higiene — 12.205 €"
    description: "El apoyo no se limitó a la comida. Hemos distribuido:"
    clothes: "Ropa nueva y usada, que no hemos podido cuantificar objetivamente en número"
    pads: "2.600 compresas, para responder a una necesidad concreta y a menudo descuidada"
    soap: "315 sets de jabones para el cuidado personal y la ropa, fundamentales para la higiene diaria"
    reason_intro: "Para quienes se pregunten por qué optamos también por distribuir ropa nueva, las razones son fundamentalmente dos:"
    reason_logistics: "<strong>Logística</strong>: enviar bienes a África en contenedores es muy costoso y no siempre es seguro que la mercancía llegue a destino; por eso intentamos aprovechar la capacidad de carga aérea de nuestros voluntarios en cada viaje."
    reason_local: "<strong>Apoyo a la economía local</strong>: creemos que quienes producen localmente deben tener la posibilidad de sustentarse, y favorecemos el empleo de mano de obra y costureras locales."
  education:
    title: "Materiales escolares y matrículas — 8.837 €"
    p1: "Creemos que la <strong>educación es una herramienta clave para el futuro</strong>. En 2025 hemos apoyado a <strong>14 niños</strong> con:"
    fees: "Matrículas en la escuela privada"
    materials: "Libros, cuadernos, artículos de papelería, atlas, enciclopedias y diccionarios"
    closing: "Estos materiales no son solo herramientas de aprendizaje: son las llaves para abrir nuevas perspectivas y esperanzas en la vida de cada estudiante."
  special_projects:
    title: "Proyectos especiales — 2.830 €"
    intro: "Queremos dedicar una atención especial a los <strong>proyectos especiales</strong> iniciados durante el año."
  medical:
    title: "Chequeo médico general"
    p1: "Para Navidad propusimos algo <strong>completamente nuevo</strong> respecto a los años anteriores: un chequeo médico completo para nuestros niños, con el objetivo de <strong>verificar su salud de forma exhaustiva</strong>."
    p2: "De los <strong>16 niños involucrados</strong>, <strong>10 necesitaron exámenes adicionales y tratamientos médicos</strong>."
    p3: "Entre ellos, <strong>1 niño obtuvo la oportunidad de acceder gratuitamente a un programa de intervención quirúrgica con Operation Smile</strong>, que le permitirá <strong>hablar correctamente por primera vez en su vida</strong>."
    social_note: "Quien quiera conocer mejor su historia puede encontrar más detalles en nuestras páginas de redes sociales."
    p4: "La toma de conciencia de la precariedad de su salud — no siempre visible a simple vista — nos llevó a <strong>incluir el chequeo médico entre los proyectos estables</strong> de asistencia."
    p5: "Desde hoy puedes regalar un <em>\"chequeo suspendido\"</em> para un niño y convertirte en parte activa de su camino hacia la salud."
  haller:
    title: "Visita al Haller Park"
    p1: "La otra gran experiencia navideña fue la <strong>visita al Haller Park</strong>, el parque de animales de Mombasa."
    p2: "La mayoría de los niños <strong>nunca habían salido de su aldea ni visto una gran ciudad</strong>. Esta salida formativa no fue solo diversión:"
    bullet1: "estimuló la <strong>curiosidad y la apertura mental</strong> de los niños"
    bullet2: "les permitió enfrentarse a entornos nuevos"
    bullet3: "favoreció el <strong>aprendizaje directo a través de la naturaleza y los animales</strong>, creando recuerdos duraderos que fortalecen la autoestima y las relaciones sociales"
    closing: "Estas experiencias formativas son fundamentales para ampliar los horizontes de los niños y ayudarles a construir confianza en sí mismos y en sus sueños."
  outlook:
    title: "Perspectivas y proyectos para el 2026"
  solidarity_gifts:
    title: "Regalos solidarios — Donar para compartir"
    p1: "Impulsados por la idea de promocionar Salim ODV en un mercadillo de pueblo, lanzamos un concepto artesanal que refleja el espíritu de nuestra misión. La acogida de esta idea fue tan cálida que decidimos <strong>desarrollarla en un proyecto estable</strong>:"
    p2: "Regalos solidarios para ocasiones como <strong>bodas, confirmaciones, graduaciones, regalos de fin de año para maestros y empleados</strong>..."
    p3: "Se trata de <strong>propuestas únicas hechas a mano</strong>, pensadas para ser <strong>algo tangible que puedes compartir con amigos y seres queridos</strong>, contando la historia de Salim mientras apoyas un proyecto concreto."
    p4: "Contáctanos para construir juntos tu propuesta personalizada, y próximamente encontraréis una sección dedicada en nuestro sitio web."
  solidarity_trips:
    title: "Viajes solidarios"
    p1: "¿Alguna vez has pensado en vivir una experiencia en Kenya en contacto directo con las realidades rurales de las aldeas? ¿Te gustaría <strong>experimentar de primera mano el impacto de los proyectos de Salim</strong>, conocer a las familias apoyadas y comprender realmente lo que significa trabajar en el terreno?"
    p2: "En 2026 queremos abrir las puertas a quienes deseen vivir una experiencia de <strong>voluntariado e inmersión en la cultura keniata</strong>, acompañados por quienes conocen profundamente estos lugares."
    p3: "<strong>Jessica y Salimu</strong> estarán listos para acogerte y guiarte en un recorrido auténtico: entre aldeas, proyectos activos y momentos de compartir real, con el apoyo de una larga experiencia en la acogida y la organización de safaris responsables."
    p4: "No un simple viaje, sino una experiencia que deja huella — por dentro y por fuera."
  health_project:
    title: "Proyecto \"Salud Suspendida\""
    p1: "La experiencia de los chequeos médicos de 2025 nos abrió los ojos ante una realidad a menudo invisible: <strong>la fragilidad de la salud de los niños</strong>, incluso cuando aparentemente parecen estar bien."
    p2: "Por este motivo hemos decidido hacer estable el proyecto <strong>\"Salud Suspendida\"</strong>, ya iniciado con los chequeos navideños."
    p3: "Desde hoy es posible <strong>regalar un chequeo médico suspendido</strong> a un niño, contribuyendo de manera directa y concreta a la prevención, al diagnóstico precoz y al tratamiento."
    p4: "Un gesto sencillo que puede cambiar radicalmente el futuro de un niño."
    link_text: "Descubre el proyecto Chequeo Médico"
  thanks:
    title: "Gracias de corazón"
    p1: "Todos estos resultados son posibles <strong>solo gracias a ti</strong>: a tu confianza, a tu apoyo y a tu cercanía. Compartir los frutos de nuestro trabajo con total <strong>transparencia y responsabilidad</strong> es un valor fundamental para Salim ODV, porque creemos que cada donante debe saber cómo su contribución llega y se transforma en fruto en la vida de quien la recibe."

